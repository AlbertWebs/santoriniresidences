server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name santoriniresidences.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.santoriniresidences.com;
    root /var/www/santoriniresidences/public;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://santoriniresidences.com$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/santoriniresidences.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santoriniresidences.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.santoriniresidences.com;

    ssl_certificate /etc/letsencrypt/live/www.santoriniresidences.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.santoriniresidences.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://santoriniresidences.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name santoriniresidences.com;
    root /var/www/santoriniresidences/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/santoriniresidences.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santoriniresidences.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        if ($request_uri ~* "^/index\\.php(\\?.*)?$") { return 301 https://santoriniresidences.com/$is_args$args; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
